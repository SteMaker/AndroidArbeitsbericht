# Project-wide Gradle settings.
#
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
#
# For more details on how to configure your build environment visit
# https://docs.gradle.org/current/userguide/build_environment.html

# JVM arguments for the Gradle daemon. The Kotlin/KSP/databinding processors on this
# project need noticeably more than the old 1536m default.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8

org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# AndroidX package structure
android.useAndroidX=true

# Kotlin code style for this project: "official" or "obsolete"
kotlin.code.style=official

# Keep R classes non-transitive, which is the default from AGP 8 onwards and keeps
# resource references unambiguous.
android.nonTransitiveRClass=true
