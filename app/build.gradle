plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.serialization)
    // Data binding's annotation processor only sees @BindingAdapter methods declared in
    // Kotlin via kapt; AGP wires databinding-compiler into the kapt configuration itself.
    alias(libs.plugins.legacy.kapt)
    alias(libs.plugins.ksp)
    alias(libs.plugins.google.services)
    alias(libs.plugins.crashlytics)
}

android {
    namespace 'com.stemaker.arbeitsbericht'
    compileSdk libs.versions.compileSdk.get().toInteger()
    compileSdkMinor libs.versions.compileSdkMinor.get().toInteger()

    defaultConfig {
        applicationId "com.stemaker.arbeitsbericht"
        minSdk libs.versions.minSdk.get().toInteger()
        targetSdk libs.versions.targetSdk.get().toInteger()
        versionCode 33
        versionName "v2.22.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        debug {
            enableUnitTestCoverage true
            enableAndroidTestCoverage true
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        dataBinding true
        viewBinding true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += [
                    'META-INF/DEPENDENCIES',
                    'META-INF/LICENSE*',
                    'META-INF/NOTICE*',
                    'META-INF/INDEX.LIST',
                    'META-INF/*.kotlin_module',
            ]
        }
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = true
        }
    }

    lint {
        abortOnError false
        warningsAsErrors false
        sarifReport true
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

// We store the Room schema as a file in git, so we have a version history.
ksp {
    arg('room.schemaLocation', "$projectDir/schemas".toString())
    arg('room.generateKotlin', 'true')
}

dependencies {
    // Kotlin
    implementation libs.kotlin.reflect
    implementation libs.kotlinx.coroutines.core
    implementation libs.kotlinx.coroutines.android
    implementation libs.kotlinx.serialization.json
    implementation libs.kotlinx.serialization.cbor

    // AndroidX
    implementation libs.androidx.appcompat
    implementation libs.androidx.core.ktx
    implementation libs.androidx.constraintlayout
    implementation libs.androidx.preference.ktx
    implementation libs.androidx.security.crypto.ktx
    implementation libs.androidx.fragment.ktx
    implementation libs.androidx.lifecycle.viewmodel.ktx
    implementation libs.androidx.lifecycle.livedata.ktx
    implementation libs.androidx.lifecycle.runtime.ktx
    implementation libs.material

    // Room
    implementation libs.androidx.room.runtime
    implementation libs.androidx.room.ktx
    ksp libs.androidx.room.compiler

    // Third party
    implementation libs.glide
    implementation libs.gson
    implementation libs.androidsvg
    implementation libs.signature.pad
    implementation libs.jsch
    implementation libs.joda.time

    // ODF Toolkit and Apache POI, repackaged as shaded jars by the sibling modules
    implementation project(path: ':odftoolkit-fat', configuration: 'shadow')
    implementation project(path: ':poi-android-fat', configuration: 'shadow')

    // Firebase
    implementation platform(libs.firebase.bom)
    implementation libs.firebase.analytics
    implementation libs.firebase.crashlytics

    // Local unit tests (JVM / Robolectric)
    testImplementation libs.junit
    testImplementation libs.robolectric
    testImplementation libs.mockk
    testImplementation libs.truth
    testImplementation libs.androidx.arch.core.testing
    testImplementation libs.kotlinx.coroutines.test
    testImplementation libs.androidx.test.core.ktx
    testImplementation libs.androidx.test.ext.junit.ktx
    testImplementation libs.androidx.room.testing

    // Instrumented tests (on device / emulator)
    androidTestImplementation libs.androidx.test.core.ktx
    androidTestImplementation libs.androidx.test.runner
    androidTestImplementation libs.androidx.test.rules
    androidTestImplementation libs.androidx.test.ext.junit.ktx
    androidTestImplementation libs.espresso.core
    androidTestImplementation libs.espresso.contrib
    androidTestImplementation libs.espresso.intents
    androidTestImplementation libs.uiautomator
    androidTestImplementation libs.truth
    androidTestImplementation libs.mockk.android
    androidTestImplementation libs.kotlinx.coroutines.test
    androidTestImplementation libs.androidx.room.testing
}
