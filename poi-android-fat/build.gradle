/*
 * Repackages the Android-friendly Apache POI build into a single shaded jar.
 * stax2 is relocated so that it cannot clash with the XML APIs on the Android platform.
 */
plugins {
    id 'java-library'
    alias(libs.plugins.shadow)
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

dependencies {
    implementation libs.poi.android
}

tasks.named('shadowJar') {
    archiveClassifier.set('')
    relocate 'org.codehaus.stax2', 'shadow-poi.codehaus.stax2'
}

tasks.named('jar') {
    dependsOn tasks.named('shadowJar')
}
