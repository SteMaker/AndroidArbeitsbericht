/*
 * Repackages the ODF Toolkit (odfdom) and its XML stack into a single shaded jar that
 * the Android app can consume. Shading is needed because odfdom pulls in XML APIs that
 * clash with the ones bundled in the Android platform.
 */
plugins {
    id 'java-library'
    alias(libs.plugins.shadow)
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

dependencies {
    implementation libs.odfdom.java
    implementation libs.woodstox.core
}

tasks.named('shadowJar') {
    archiveClassifier.set('')
}

tasks.named('jar') {
    dependsOn tasks.named('shadowJar')
}
